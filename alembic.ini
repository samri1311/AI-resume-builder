[alembic]
# Path to migration scripts.
script_location = alembic

# Template used to generate migration file names.
file_template = %%(rev)s_%%(slug)s

# Max length of the "slug" appended to the filename.
truncate_slug_length = 40

# sys.path path, will be prepended to sys.path if present, for the
# migration environment (env.py already inserts the project root itself,
# but this is the standard alembic.ini way of doing the same thing).
prepend_sys_path = .

# Timezone for timestamps embedded in migration filenames.
timezone = UTC

# Max length of characters to apply to the "slug" field.
version_path_separator = os

# The actual database URL is set in env.py from backend.core.config, so
# there's a single source of truth (your .env) instead of a second copy
# living in this file.
sqlalchemy.url =


[post_write_hooks]
# Left empty on purpose — no autoformatting hooks configured.


[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
